name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download Xray core (libv2ray.aar)
        run: |
          mkdir -p app/libs
          URL=$(curl -sL https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest | grep -o 'https://[^"]*\.aar' | head -n 1)
          echo "Downloading: $URL"
          curl -L -o app/libs/libv2ray.aar "$URL"
          test -s app/libs/libv2ray.aar || (echo "AAR download failed!" && exit 1)
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Arka-APK
          path: app/build/outputs/apk/debug/app-debug.apk
